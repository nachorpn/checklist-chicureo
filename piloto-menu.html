<!DOCTYPE html>

<head>

<title>Gestark · Piloto de menú</title>
<style>
:root{color-scheme:light;--bg:#f5f7f4;--white:#fff;--ink:#26372c;--muted:#77837b;--green:#456b50;--sage:#e7efe4;--line:#e9ede8;--red:#a74c4e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}.header{background:#fff;border-bottom:1px solid var(--line);padding:calc(15px + env(safe-area-inset-top)) 20px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:39px;height:39px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:17px;font-weight:600;letter-spacing:-1px}.brand-name{font-size:19px;font-weight:650;letter-spacing:-.6px}.branch{font-size:11px;color:var(--muted);margin-top:3px}.header-actions{display:flex;align-items:center;gap:10px}.online{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--green);white-space:nowrap}.online:before{content:"";width:6px;height:6px;border-radius:50%;background:#7d9f7b}.icon-btn{height:43px;width:43px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--green)}.main{max-width:620px;margin:auto;padding:28px 20px 100px}.pilot{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 15px;font-weight:550}.main h1{font-size:29px;letter-spacing:-1px;font-weight:640;margin:0 0 25px}.quick{font-size:13px;color:var(--muted);margin-bottom:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-height:131px;display:flex;flex-direction:column;gap:12px}.tile-icon{background:var(--sage);color:var(--green);border-radius:12px;width:39px;height:39px;display:grid;place-items:center}.tile b{font-size:14px;font-weight:600}.tile small{font-size:11px;color:var(--muted);display:block;margin-top:5px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:1}.nav div{font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);min-width:44px}.nav .active{color:var(--green);font-weight:600}.nav svg{width:21px;height:21px}.overlay{position:fixed;inset:0;z-index:10;background:rgba(24,37,29,.38);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}.overlay.open{opacity:1;visibility:visible}.sheet{width:min(100%,440px);max-height:calc(100dvh - 30px - env(safe-area-inset-bottom));overflow:auto;background:#fff;border-radius:25px;padding:10px 22px 18px;box-shadow:0 18px 65px #1c302b22;transform:translateY(18px);transition:transform .24s ease}.overlay.open .sheet{transform:translateY(0)}.handle{width:33px;height:4px;background:#dce3dc;border-radius:99px;margin:0 auto 12px}.sheet-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.sheet h2{font-size:21px;font-weight:630;letter-spacing:-.55px;margin:0}.close{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:50%;background:#f3f5f2;color:#758278}.close svg{width:18px;height:18px}.profile{display:flex;align-items:center;gap:12px;padding:14px;background:#f7f9f6;border-radius:15px;margin-bottom:17px}.avatar{width:44px;height:44px;background:var(--sage);color:var(--green);border-radius:50%;display:grid;place-items:center}.avatar svg{width:24px;height:24px}.profile-label{font-size:11px;color:var(--muted);margin-bottom:4px}.profile-name{font-size:15px;font-weight:600}.menu-list{border-top:1px solid var(--line)}.menu-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:62px;padding:12px 4px;background:transparent;border:0;border-bottom:1px solid var(--line);font-size:15px;font-weight:500;color:var(--ink);border-radius:0}.menu-item:last-child{border-bottom:0}.menu-item:hover,.menu-item:active{background:#f7f9f6}.menu-item .glyph{color:#5b7461;width:24px;height:24px}.menu-item .chev{margin-left:auto;color:#a1aba3;width:15px;height:15px}.menu-item.danger,.menu-item.danger .glyph{color:var(--red)}.toast{position:fixed;z-index:20;bottom:calc(77px + env(safe-area-inset-bottom));left:50%;width:max-content;max-width:calc(100% - 32px);transform:translate(-50%,10px);background:#344e3c;color:white;font-size:13px;line-height:1.5;border-radius:12px;padding:13px 17px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:720px){.overlay{align-items:center}.sheet{padding:14px 26px 22px}.handle{display:none}.sheet-heading{margin-top:4px}.main{padding-top:40px}.header{padding-left:max(24px,calc((100% - 620px)/2));padding-right:max(24px,calc((100% - 620px)/2))}}@media(max-width:355px){.header{padding-left:12px;padding-right:12px}.online{display:none}.sheet{padding-left:17px;padding-right:17px}.menu-item{min-height:55px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 1-2-5.3L20 8M20 3v5h-5"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-install" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 7v8m-3-3 3 3 3-3M11 18h2"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4M8 21h8"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M10 12h11m-4-4 4 4-4 4"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-package" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm-9 5 9 5 9-5M12 13v9M7.5 5.5l9 5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2m-6 8 2 2 4-4"/></symbol>
<symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M21 10h-6a3 3 0 0 0 0 6h6M15 13h.1"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6 6-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(1 0)"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10Zm6 10v-7h6v7"/></symbol>
</defs></svg>
<div id="background"><header class="header"><div class="brand"><div class="brand-mark">GS</div><div><div class="brand-name">Gestark</div><div class="branch">Sucursal Chicureo</div></div></div><div class="header-actions"><span class="online">En línea</span><button class="icon-btn" id="open-menu" aria-label="Abrir opciones" aria-haspopup="dialog" aria-expanded="false"><svg><use href="#i-more"/></svg></button></div></header>
<main class="main"><p class="pilot">Piloto visual · Sin datos reales</p><h1>Inicio</h1><div class="quick">Accesos rápidos</div><div class="cards"><div class="tile"><div class="tile-icon"><svg><use href="#i-package"/></svg></div><div><b>Entregas clientes</b><small>Escaneo y nómina</small></div></div><div class="tile"><div class="tile-icon"><svg><use href="#i-wallet"/></svg></div><div><b>Transferencias</b><small>Registro de pagos</small></div></div><div class="tile"><div class="tile-icon"><svg><use href="#i-check"/></svg></div><div><b>Checklist</b><small>Control diario</small></div></div><div class="tile"><div class="tile-icon"><svg><use href="#i-link"/></svg></div><div><b>Repositorio</b><small>Enlaces y formularios</small></div></div></div></main><nav class="nav" aria-label="Navegación ilustrativa"><div class="active"><svg><use href="#i-home"/></svg>Inicio</div><div><svg><use href="#i-check"/></svg>Checklist</div><div><svg><use href="#i-package"/></svg>Clientes</div><div><svg><use href="#i-wallet"/></svg>Pagos</div><div><svg><use href="#i-more"/></svg>Más</div></nav></div>
<div class="overlay" id="overlay" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="title"><div class="handle" aria-hidden="true"></div><div class="sheet-heading"><h2 id="title">Opciones</h2><button class="close" id="close-menu" aria-label="Cerrar opciones"><svg><use href="#i-close"/></svg></button></div><div class="profile"><div class="avatar"><svg><use href="#i-user"/></svg></div><div><div class="profile-label">Mi perfil</div><div class="profile-name">Usuario de ejemplo</div></div></div><div class="menu-list"><button class="menu-item" data-action="Actualizar"><svg class="glyph"><use href="#i-refresh"/></svg><span>Actualizar</span><svg class="chev"><use href="#i-chevron"/></svg></button><button class="menu-item" data-action="Instalar aplicación"><svg class="glyph"><use href="#i-install"/></svg><span>Instalar aplicación</span><svg class="chev"><use href="#i-chevron"/></svg></button><button class="menu-item" data-action="Vista clásica"><svg class="glyph"><use href="#i-monitor"/></svg><span>Vista clásica</span><svg class="chev"><use href="#i-chevron"/></svg></button><button class="menu-item danger" data-action="Cerrar sesión"><svg class="glyph"><use href="#i-logout"/></svg><span>Cerrar sesión</span><svg class="chev"><use href="#i-chevron"/></svg></button></div></section></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),overlay=$('overlay'),open=$('open-menu'),close=$('close-menu'),background=$('background'),toast=$('toast');let timer;function show(){overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');open.setAttribute('aria-expanded','true');background.inert=true;document.body.style.overflow='hidden';close.focus({preventScroll:true});}function hide(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');background.inert=false;open.setAttribute('aria-expanded','false');document.body.style.overflow='';open.focus({preventScroll:true});}open.addEventListener('click',show);close.addEventListener('click',hide);overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape'){hide();return}if(e.key==='Tab'){const items=[...overlay.querySelectorAll('button')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});overlay.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{hide();toast.textContent='Piloto: '+b.dataset.action+' (simulado)';toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),3000)}));show()})();
</script>
