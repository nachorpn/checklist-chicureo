</style></head><body>
<header class="top"><div class="top-inner"><div class="brand" aria-hidden="true">G</div><div class="brandcopy"><strong>Gestark</strong><small>Sucursal Chicureo · Piloto</small></div><button class="plain" id="refresh" aria-label="Actualizar"><span data-icon="refresh"></span></button><button class="plain" id="open-menu" aria-label="Opciones"><span data-icon="morev"></span></button></div></header>
<main class="main"><section class="view" id="home"><div class="head"><h1>Inicio</h1><span class="date" id="date"></span></div><span class="demo">Vista piloto · datos de ejemplo</span><div class="summary" aria-label="Resumen operativo de ejemplo"><div class="metric"><small>OF por cerrar</small><strong>12</strong></div><div class="metric"><small>Venta acumulada · <span id="month"></span></small><strong>—</strong><em>Próximamente</em></div></div><h2 class="section-title">Operaciones</h2><div class="ops" id="ops"></div><h2 class="section-title">Herramientas</h2><div class="tools" id="tools"></div></section><section class="view" id="detail" hidden><button class="back" id="back">‹ Inicio</button><div class="head"><h1 id="detail-title"></h1></div><div class="panel" id="detail-content"></div></section></main>

<script>
'use strict';
const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',check:'<rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="2" width="6" height="5" rx="1.5"/><path d="m8 13 2 2 5-5m-7 8h7"/>',scan:'<path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5M7 7v10m3-10v10m4-10v10m3-10v10"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M21 10h-5a2.5 2.5 0 0 0 0 5h5M16 12.5h.1"/>',box:'<path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm-9 5 9 5 9-5m-9 5v9m-4-17 8 4"/>',alert:'<path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm-9 5 9 5 9-5m-9 5v9M8 5l8 4"/><path d="M17 13v3m0 2h.01"/>',contact:'<rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="9" r="2.5"/><path d="M7.5 17c0-4 9-4 9 0M2 8h3m-3 7h3"/>',files:'<path d="M7 3h8l4 4v14H7zM15 3v5h4M4 6v13m6-7h6m-6 4h6"/>',folder:'<path d="M3 6h7l2 3h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',chat:'<path d="M21 11a9 9 0 0 1-9 9 9 9 0 0 1-4-.9L3 21l1.8-5A9 9 0 1 1 21 11Z"/><path d="M8 10h8m-8 4h5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5m10-5v5M3 10h18m-14 4h2m3 0h2m3 0h1m-11 4h2m3 0h2"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',morev:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',refresh:'<path d="M20 11a8 8 0 1 1-2-5m2-2v6h-6"/>',arrow:'<path d="M6 18 18 6M7 6h11v11"/>',chevron:'<path d="m9 6 6 6-6 6"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[k]}</svg>`;const $=id=>document.getElementById(id);const ops=[['clients','Entregas clientes','scan','#D9EADD','#347552','#254D36'],['payments','Transferencias','wallet','#DBE8F2','#477A9B','#31546D'],['checklist','Checklist diario','check','#E9E3F3','#8070A6','#51446D'],['contingencies','Contingencias','alert','#F5E6D5','#B88950','#80603D']];const tools=[['directory','Directorio','contact','#DCEADF','#3E7351'],['cases','Gestiones','files','#DFE8F1','#527997'],['repository','Repositorio','folder','#EAE5D8','#83723F'],['collection','Cobranza','chat','#DDEDE7','#39806B'],['calendar','Calendario','calendar','#E8E1F1','#8470A0'],['notifications','Notificaciones','bell','#F2E7D6','#94703A']];const navs=[['home','Inicio','home','#52755E','#E4ECE5'],['checklist','Checklist','check','#83739F','#EEE9F4'],['clients','Entregar','scan','#245840','#DCEADF'],['payments','Pagos','wallet','#507F9B','#E4EDF4'],['more','Más','more','#68766D','#E8ECE9']];
$('ops').innerHTML=ops.map(([id,label,k,bg,accent,fg])=>`<button class="tile" data-view="${id}" style="--bg:${bg};--accent:${accent};--fg:${fg}"><span class="tiletop"><span class="tileicon">${icon(k)}</span><span class="arrow">${icon('arrow')}</span></span><strong>${label}</strong></button>`).join('');$('tools').innerHTML=tools.map(([id,label,k,bg,fg])=>`<button class="tool" data-view="${id}" style="--bg:${bg};--fg:${fg}"><span class="toolicon">${icon(k)}</span><span>${label}</span></button>`).join('');$('nav').innerHTML=navs.map(([id,label,k,fg,bg])=>`<button class="navbtn ${id==='clients'?'primary':''}" data-view="${id}" style="--fg:${fg};--bg:${bg}" ${id==='home'?'aria-current="page"':''}><span class="navicon">${icon(k)}</span><span class="label">${label}</span></button>`).join('');document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const today=new Date();$('date').textContent=new Intl.DateTimeFormat('es-CL',{day:'numeric',month:'long',timeZone:'America/Santiago'}).format(today);$('month').textContent=new Intl.DateTimeFormat('es-CL',{month:'long',timeZone:'America/Santiago'}).format(today);
const labels=Object.fromEntries([...ops,...tools,['more','Más herramientas']].map(([id,label])=>[id,label]));let current='home',timer,prefs={orders:true,checklist:true};function toast(msg){clearTimeout(timer);$('toast').textContent=msg;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,2600)}function render(id){if(id!=='home'&&!labels[id])return;current=id;$('home').hidden=id!=='home';$('detail').hidden=id==='home';document.querySelectorAll('.navbtn').forEach(b=>{if(b.dataset.view===(navs.some(n=>n[0]===id)?id:'more'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(id==='home'){window.scrollTo(0,0);return}$('detail-title').textContent=labels[id];if(id==='notifications'){$('detail-content').innerHTML=`<span class="preview-status">Preferencias de ejemplo</span><label><input type="checkbox" id="pref-orders" ${prefs.orders?'checked':''}><span><strong>OF pendientes</strong><small>Lun. a vie. · 10:00, 13:30 y 17:00 · solo si hay pendientes</small></span></label><label><input type="checkbox" id="pref-check" ${prefs.checklist?'checked':''}><span><strong>Checklist diario</strong><small>Lun. a vie. · 12:30</small></span></label><button class="cta" id="save-prefs">Guardar preferencias</button><p class="notice">Los avisos pueden llegar con retraso. El recordatorio del checklist se envía aunque ya lo hayas completado.</p><p class="notice">Piloto: no activa notificaciones reales.</p>`;$('save-prefs').onclick=()=>{prefs={orders:$('pref-orders').checked,checklist:$('pref-check').checked};toast('Preferencias de prueba guardadas')};}else if(id==='more'){$('detail-content').innerHTML=tools.map(([key,label,k])=>`<button class="rowlink" data-view="${key}">${icon(k)}<span>${label}</span>${icon('chevron')}</button>`).join('');}else{$('detail-content').innerHTML=`<h2>${labels[id]}</h2><p>Acceso de demostración. En Gestark, aquí se abrirá el módulo existente.</p><p class="notice">Este piloto no registra, modifica ni consulta datos reales.</p>`;}window.scrollTo(0,0)}document.addEventListener('click',e=>{const target=e.target.closest('[data-view]');if(target)render(target.dataset.view);const menu=e.target.closest('[data-menu]');if(menu){closeMenu();toast(menu.dataset.menu+' · acción de prueba')}});$('back').onclick=()=>render('home');$('refresh').onclick=()=>{render(current);toast('Vista de prueba actualizada')};function closeMenu(){$('menu').hidden=true;$('open-menu').focus()}$('open-menu').onclick=()=>{$('menu').hidden=false;$('close-menu').focus()};$('close-menu').onclick=closeMenu;$('menu').onclick=e=>{if(e.target===$('menu'))closeMenu()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('menu').hidden)closeMenu()});
</script></body></html>
