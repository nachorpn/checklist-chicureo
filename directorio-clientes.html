<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f5">
<meta name="robots" content="noindex,nofollow">
<title>Directorio de clientes · Gestark</title>
<link rel="icon" href="./icon-192.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#203d31;background:#f4f7f5}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #32a679;outline-offset:2px}
[hidden]{display:none!important}
html:not(.gestark-unlocked) body>*:not(#gestark-login):not(#gestark-native-error):not(#gestark-native-retry):not(noscript){display:none!important}
main{max-width:920px;margin:auto;padding:16px 15px 35px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}
h1{font-size:21px;letter-spacing:-.6px;margin:0}#total{font-size:12px;color:#637f70;margin-top:3px;font-weight:650}
.actions{display:flex;gap:7px;flex-wrap:wrap}button.primary{background:#0b8057;border:1px solid #0b8057;color:#fff}button.secondary{background:#fff;border:1px solid #cbded2;color:#176246}
.actions button,.dialog-actions button{border-radius:10px;min-height:41px;padding:9px 12px;font-size:12px;font-weight:800}
#filter{display:block;width:100%;height:43px;padding:9px 13px;border-radius:11px;border:1px solid #d1e3d8;background:#fff;font-size:14px;color:#234c39;outline-offset:2px}
#status{font-size:11px;color:#71887a;min-height:18px;margin:9px 2px 7px}
.list{background:white;border:1px solid #dce9e0;border-radius:13px;overflow:hidden}
.head,.entry{display:grid;grid-template-columns:minmax(120px,2fr) minmax(105px,1.1fr) minmax(125px,1.2fr) 65px 68px;align-items:center;gap:9px;padding:10px 13px}
.head{background:#f1f7f3;color:#587968;font-size:10px;letter-spacing:.04em;font-weight:850;text-transform:uppercase}
.entry{border-top:1px solid #edf1ee;min-height:51px;font-size:12px}
.cell{overflow-wrap:anywhere;min-width:0}.person{font-size:13px;font-weight:800;color:#1b4b36}.rut{font-variant-numeric:tabular-nums;white-space:nowrap}
.phone{color:#176b4d;text-decoration:none;white-space:nowrap}.tag{font-size:10px;color:#63796c}.rowactions{display:flex;justify-content:flex-end;gap:4px}
.iconbtn{border:1px solid #e1eae4;background:#fff;border-radius:7px;color:#486b56;padding:6px;font-size:12px;min-height:30px}
.empty{padding:25px 12px;text-align:center;color:#799083;font-size:13px}
.dialog{border:0;border-radius:16px;padding:0;width:min(96vw,540px);max-height:min(93dvh,850px);box-shadow:0 18px 65px #082c2440;color:#204332}
.dialog::backdrop{background:#102b2199}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 10px;border-bottom:1px solid #edf1ed}
.modal-head h2{font-size:17px;letter-spacing:-.3px;margin:0}.close{background:none;border:0;font-size:24px;color:#6d8376;padding:0 5px}
.modal-body{padding:15px 17px 17px;overflow:auto;max-height:calc(93dvh - 60px)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:grid;gap:5px;font-size:11px;font-weight:800;color:#496956}.fields label.full{grid-column:1/-1}
.fields input{width:100%;min-height:42px;border:1px solid #d0e1d6;border-radius:9px;padding:9px 11px;color:#1c4530;font-size:14px;background:#fff}.fields input:read-only{background:#f1f4f1;color:#66786a}
.help{font-weight:600;font-size:10px;color:#6e8576;min-height:13px}.error{font-size:12px;color:#b73236;min-height:16px;margin:9px 0 0}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:#245b42;font-weight:800;min-height:34px}.check input{accent-color:#0b8057;width:17px;height:17px}
.invoice{border-top:1px solid #e0ece3;margin-top:7px;padding-top:14px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
#export-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;margin:10px 0}#export-fields label{display:flex;gap:8px;align-items:center;font-size:12px;min-height:30px}#export-fields input{accent-color:#0b8057}
.explain{font-size:11px;color:#637c6c;line-height:1.45}.line{height:1px;background:#e8eee9;margin:13px 0}.radio{display:flex;align-items:center;gap:8px;font-size:12px;min-height:28px}.radio input{accent-color:#0b8057}
@media(max-width:650px){.head{display:none}.entry{grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;padding:9px 11px}.entry>.person{grid-column:1;grid-row:1}.entry>.rut{grid-column:1;grid-row:2;color:#6e8175;font-size:11px}.entry>.phone{grid-column:1;grid-row:3;font-size:12px}.entry>.tag{grid-column:2;grid-row:1;text-align:right}.entry>.rowactions{grid-column:2;grid-row:2/4;align-self:center}.fields{grid-template-columns:1fr}.fields label.full{grid-column:auto}main{padding:14px 11px 27px}.top{align-items:flex-start}}

/* Directorio v19: jerarquía visual cuidada, sin tarjetas grandes ni texto añadido. */
body{background:#f4f8f5}
main#directory{max-width:1080px;padding:19px 15px 42px}
.top{position:relative;margin-bottom:16px;padding:3px 0 5px 13px;border-left:3px solid #0f8e62}
.top h1{font-size:clamp(23px,3vw,29px);line-height:1.15;font-weight:900;color:#143d2d;letter-spacing:-.85px}
#total{font-weight:750;color:#597969;margin-top:5px}
.actions{gap:8px}
.actions button{min-height:40px;padding:9px 14px;border-radius:11px;font-size:12px;box-shadow:none}
.actions .primary{background:#0b865d;border-color:#0b865d;box-shadow:0 3px 9px #065c3a19}
.actions .primary:active{background:#0c694d}
.actions .secondary{border-color:#d2e5d9;background:#fff}
#filter{height:46px;border:1px solid #cee2d5;border-radius:11px;padding:10px 15px;background:#fff;box-shadow:0 2px 8px #0c3b1b09}
#filter:focus{border-color:#51a985;outline:2px solid #96d9b955;outline-offset:1px}
#status{margin:9px 3px 10px;font-size:11px;min-height:16px;font-weight:650}
.list{border:1px solid #d5e5d9;border-radius:12px;background:#fff;box-shadow:0 5px 20px #153f250c}
.head{background:#edf5f0;padding:10px 14px;color:#49745f;font-weight:850;font-size:10px;letter-spacing:.045em}
.entry{padding:10px 14px;min-height:53px;gap:12px;border-top:1px solid #e9f0ec}
.entry:hover{background:#fbfdfb}
.entry .person{font-weight:850;color:#174d37}
.entry .rut{font-variant-numeric:tabular-nums;font-size:12px;color:#365d47}
.entry .phone{font-weight:700;color:#0c8458}
.entry .tag{display:inline-flex;align-items:center;justify-content:center;justify-self:start;min-height:24px;padding:3px 9px;border-radius:7px;background:#f4f7f4;color:#7b8c80;font-size:10px;font-weight:750}
.entry .tag.is-invoice{background:#e5f5ec;color:#16734b}
.entry .rowactions{align-items:center;gap:5px}
.entry .iconbtn{font-size:11px;font-weight:750;color:#3c6650;border:1px solid #dce9df;background:#fff;border-radius:7px;min-height:31px;padding:6px 8px}
.entry .iconbtn:hover{border-color:#97c6a9;background:#f3faf5}
.dialog{border-radius:17px}
.modal-head h2{font-weight:850;color:#1a5039}
.fields label{color:#496c57}
.fields input:focus{border-color:#70b999;outline:2px solid #69b9933b;outline-offset:1px}
@media(max-width:650px){
 main#directory{padding:16px 11px 31px}
 .top{margin-bottom:12px;padding:2px 0 4px 11px;gap:9px}
 .top h1{font-size:21px}
 .actions{gap:6px}
 .actions button{padding:8px 10px;min-height:37px;font-size:11px}
 #filter{height:43px}
 .entry{grid-template-columns:minmax(0,1fr) 93px;padding:10px 12px;gap:4px 7px}
 .entry .tag{grid-column:2;grid-row:1;justify-self:end}
 .entry .rowactions{grid-column:2;grid-row:2/4;justify-content:end}
 .entry .iconbtn{padding:5px 6px;font-size:11px}
 .entry .person{font-size:12.5px}
 .entry .rut{font-size:11px}
 .entry .phone{font-size:11.5px}
}

/* Gestark v20 · Legibilidad de contactos (incremento moderado, sin tarjetas grandes). */
.head{font-size:11px}
.entry{min-height:60px;padding-top:12px;padding-bottom:12px;font-size:14px;line-height:1.35}
.entry .person{font-size:15px;line-height:1.35}
.entry .rut,.entry .phone{font-size:13.5px;line-height:1.35}
.entry .tag{font-size:11px}
.entry .iconbtn{font-size:12px;min-height:34px}
@media(max-width:650px){
  .entry{grid-template-columns:minmax(0,1fr) 98px;min-height:0;padding:11px 12px;gap:5px 8px}
  .entry .person{font-size:15px;line-height:1.35}
  .entry .rut,.entry .phone{font-size:13.5px;line-height:1.4}
  .entry .tag{font-size:10.5px}
  .entry .iconbtn{font-size:11.5px;min-height:34px}
}

/* Gestark v21 · Aviso de facturación visible y accesible, sin ampliar las tarjetas. */
.entry.needs-invoice{background:#fffdf7;box-shadow:inset 3px 0 0 #d69e35}
.entry.needs-invoice:hover{background:#fff9ea}
.entry .tag.is-invoice{
  background:#fff0c9;color:#714500;border:1px solid #e6bd68;
  font-size:11px;font-weight:850;line-height:1.25;
  padding:5px 8px;min-height:28px;white-space:nowrap;
}
/* La nueva etiqueta requiere un poco más de ancho sin agrandar las filas. */
.head,.entry{grid-template-columns:minmax(120px,2fr) minmax(105px,1.1fr) minmax(125px,1.2fr) minmax(139px,.9fr) 76px}
.invoice-warning{
  color:#745015;background:#fff7e4;border:1px solid #e5c77c;border-radius:9px;
  padding:9px 11px;margin:0 0 12px;font-size:12px;font-weight:700;line-height:1.4;
}
@media(max-width:650px){
  .entry{grid-template-columns:minmax(0,1fr) 128px}
  .entry .tag.is-invoice{font-size:10.5px;padding:5px 6px}
}

/* Gestark v22 · Nombre alternativo legible bajo el nombre principal. */
.entry .name-stack{min-width:0;display:grid;gap:2px;align-content:center}
.entry .name-stack .person{min-width:0}
.entry .alternate-name{font-size:12.5px;line-height:1.35;color:#557868;font-weight:650;overflow-wrap:anywhere}
#phone-hint[data-invalid="true"]{color:#a32e30!important}
#phone[aria-invalid="true"]{border-color:#b94747!important}
@media(max-width:650px){
 .entry .name-stack{grid-column:1;grid-row:1}
 .entry .alternate-name{font-size:12.5px}
}
</style>
</head>
<body>
<main id="directory" aria-label="Directorio de clientes">
  <header class="top"><div><h1>Directorio de clientes</h1><div id="total">Cargando…</div></div><div class="actions"><button id="open-export" class="secondary" type="button">Exportar Excel</button><button id="open-add" class="primary" type="button">+ Contacto</button></div></header>
  <input id="filter" type="search" placeholder="Buscar nombre, alternativo, RUT o teléfono" autocomplete="off" aria-label="Buscar clientes">
  <div id="status" role="status" aria-live="polite">Conectando con Firebase…</div>
  <div class="list" id="list" aria-label="Contactos"></div>
</main>
<dialog id="contact-dialog" class="dialog" aria-labelledby="contact-heading">
  <div class="modal-head"><h2 id="contact-heading">Agregar contacto</h2><button type="button" class="close" data-close="contact-dialog" aria-label="Cerrar">×</button></div>
  <form id="contact-form" class="modal-body" novalidate>
    <div class="fields">
      <label class="full">Nombre o razón social<input id="name" autocomplete="name" required maxlength="100" placeholder="Nombre del cliente"></label>
      <label class="full">Nombre alternativo (opcional)<input id="alternate-name" maxlength="100" autocomplete="off" placeholder="Empresa, apodo o nombre por el que lo conocen"></label>
      <label>RUT<input id="rut" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="14" placeholder="12.345.678-5" required><span class="help" id="rut-hint"></span></label>
      <label>Teléfono<input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="90" placeholder="+56 9 91919191" required aria-describedby="phone-hint"><span class="help" id="phone-hint">Escribe o pega desde WhatsApp; el formato se adapta solo.</span></label>
    </div>
    <label class="check"><input id="invoice-enabled" type="checkbox"> Agregar datos de facturación</label>
    <section class="invoice" id="invoice-fields" hidden>
      <p class="invoice-warning" role="note">⚠ Verifica los datos tributarios antes de emitir la factura.</p>
      <div class="fields">
        <label class="full">Razón social<input id="invoice-name" maxlength="120" autocomplete="organization"></label>
        <label>RUT de facturación<input id="invoice-rut" maxlength="14" placeholder="12.345.678-5"><span class="help" id="invoice-rut-hint"></span></label>
        <label>Giro<input id="invoice-business" maxlength="120"></label>
        <label class="full">Dirección tributaria<input id="invoice-address" maxlength="180"></label>
        <label>Comuna<input id="invoice-city" maxlength="100"></label>
        <label>Correo de facturación<input id="invoice-email" type="email" maxlength="180" inputmode="email" autocomplete="email"></label>
      </div>
    </section>
    <div class="error" role="alert" id="contact-error"></div>
    <div class="dialog-actions"><button type="button" class="secondary" data-close="contact-dialog">Cancelar</button><button type="submit" class="primary" id="save">Guardar en la nube</button></div>
  </form>
</dialog>
<dialog id="export-dialog" class="dialog" aria-labelledby="export-heading">
  <div class="modal-head"><h2 id="export-heading">Exportar a Excel</h2><button type="button" class="close" data-close="export-dialog" aria-label="Cerrar">×</button></div>
  <div class="modal-body">
    <div class="explain">Todos los campos están seleccionados por defecto. Elige únicamente los que quieras incluir.</div>
    <label class="check"><input type="checkbox" id="select-all-fields" checked> Seleccionar todos los datos</label>
    <div id="export-fields"></div>
    <div class="line"></div>
    <label class="radio"><input type="radio" name="export-scope" value="all" checked> Todos los contactos</label>
    <label class="radio"><input type="radio" name="export-scope" value="filtered"> Solo resultados de la búsqueda</label>
    <div class="error" role="alert" id="export-error"></div>
    <div class="dialog-actions"><button type="button" class="secondary" data-close="export-dialog">Cancelar</button><button type="button" class="primary" id="download">Descargar .xlsx</button></div>
  </div>
</dialog>
<script src="./gestark-auth.js?v=2" defer></script>
<script src="./directorio-clientes.js?v=2026.11.22.22" defer></script>
<noscript>Gestark requiere JavaScript.</noscript>
</body>
</html>
